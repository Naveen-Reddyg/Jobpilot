services:
  web:
    build:
      context: ./apps/web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      API_INTERNAL_BASE_URL: http://api:8000
    depends_on:
      - api

  api:
    build:
      context: ./services/jobs
      dockerfile: Dockerfile
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://jobsync:jobsync_dev@postgres:5432/jobsync}
      STORAGE_CONNECTION_STRING: ${STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      STORAGE_CONTAINER: ${STORAGE_CONTAINER:-resumes}
      LOCAL_USER_ID: ${LOCAL_USER_ID:-00000000-0000-4000-8000-000000000001}
      LOCAL_USER_EMAIL: ${LOCAL_USER_EMAIL:-local-user@jobsync.invalid}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_COUNTRY: ${RAPIDAPI_COUNTRY:-us}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      - postgres
      - azurite

  discovery-worker:
    build:
      context: ./services/jobs
      dockerfile: Dockerfile
    command: python worker_main.py
    environment:
      DISCOVERY_CRON: ${DISCOVERY_CRON:-0 6,18 * * *}
      DISCOVERY_TIMEZONE: ${DISCOVERY_TIMEZONE:-UTC}
      DATABASE_URL: ${DATABASE_URL:-postgresql://jobsync:jobsync_dev@postgres:5432/jobsync}
      STORAGE_CONNECTION_STRING: ${STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
    depends_on:
      - postgres
      - azurite

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobsync
      POSTGRES_USER: jobsync
      POSTGRES_PASSWORD: jobsync_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --blobPort 10000 --loose
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite_data:/data

volumes:
  postgres_data:
  azurite_data:
